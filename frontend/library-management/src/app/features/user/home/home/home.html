<section class="view" id="user-home">
  <div class="hero">
    <div class="hero-eyebrow">LibraOS Public Library</div>
    <h1 class="hero-title">Khám phá hơn 12.000 đầu sách ngay hôm nay</h1>
    <p class="hero-desc">
      Mượn sách trực tuyến, theo dõi lịch sử và nhận gợi ý phù hợp với sở thích của bạn.
    </p>

    <div class="hero-search">
      <input
        type="text"
        placeholder="Tìm theo tên sách, tác giả, ISBN…"
        aria-label="Tìm kiếm sách"
      />
      <button type="button">Tìm kiếm</button>
    </div>
  </div>

  <div class="genre-row" aria-label="Danh mục sách">
    <button type="button" class="genre-chip active">Tất cả</button>
    <button type="button" class="genre-chip">Văn học</button>
    <button type="button" class="genre-chip">Kỹ năng sống</button>
    <button type="button" class="genre-chip">Khoa học</button>
    <button type="button" class="genre-chip">Lịch sử</button>
    <button type="button" class="genre-chip">Kinh tế</button>
  </div>

  <div class="section-head">
    <div class="section-title">Sách nổi bật</div>
    <a class="link-sm" href="#">Xem tất cả</a>
  </div>
  <div class="book-grid" id="featuredBooks">
    <div class="book-card">
        <div class="book-cover">
            <img
                class="spine-tag"
                src="https://salt.tikicdn.com/ts/product/45/3b/fc/aa81d0a534b45706ae1eee1e344e80d9.jpg"
                alt="Bìa sách Nhà giả kim"
            />
        </div>

        <div class="book-body">
        <div class="book-title">Nhà giả kim</div>
        <div class="book-author">Paulo Coelho</div>
        <div class="call-no">813.6 COE</div>

        <div class="book-foot">
            <span class="badge badge-success">Còn sách</span>
            <span style="font-size: 11px; color: var(--ink-faint);">SL: 2</span>
        </div>
        </div>
    </div>
  </div>

  <div class="section-head">
    <div class="section-title">Sách mới thêm</div>
    <a class="link-sm" href="#">Xem tất cả</a>
  </div>
  <div class="book-grid" id="newBooks">
    <div class="book-card">
        <div class="book-cover">
            <img
                class="spine-tag"
                src="https://salt.tikicdn.com/ts/product/45/3b/fc/aa81d0a534b45706ae1eee1e344e80d9.jpg"
                alt="Bìa sách Nhà giả kim"
            />
        </div>

        <div class="book-body">
        <div class="book-title">Nhà giả kim</div>
        <div class="book-author">Paulo Coelho</div>
        <div class="call-no">813.6 COE</div>

        <div class="book-foot">
            <span class="badge badge-success">Còn sách</span>
            <span style="font-size: 11px; color: var(--ink-faint);">SL: 2</span>
        </div>
        </div>
    </div>
  </div>
</section>
