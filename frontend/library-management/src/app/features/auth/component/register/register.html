<div class="form-register">
    <h1>Tạo tài khoản mới</h1>
    <p>Đã có tài khoản? <a href="">Đăng nhập</a></p>

    <form action="" (ngSubmit)="register()">
        <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" 
            name="userName"
            placeholder="Nguyễn Văn A"
            required
            [(ngModel)]="newUser.username">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email"
            id="email"
            name="email"
            placeholder="ban@gmail.com"
            required
            [(ngModel)]="newUser.email">
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input 
            [type] = "showPassword ? 'text' : 'password'" 
            id="password" 
            name="password" 
            placeholder="Tối thiểu 8 ký tự" 
            required
            (input) = "checkPassword($any($event.target).value)"
            [(ngModel)]="newUser.password">
        </div>
        <div class="password-strength">
            <div class="strength-bars">
                <div class="bar" [style.background-color]="strength >= 1 ? barColor : 'var(--primary-light)'"></div>
                <div class="bar" [style.background-color]="strength >= 2 ? barColor : 'var(--primary-light)'"></div>
                <div class="bar" [style.background-color]="strength >= 3 ? barColor : 'var(--primary-light)'"></div>
                <div class="bar" [style.background-color]="strength == 4 ? barColor : 'var(--primary-light)'"></div>
            </div>
            <p>{{ strengthMessage }}</p>
        </div>

        <div class="form-group">
            <label>Nhập lại mật khẩu</label>
            <input 
            [type] = "showPassword ? 'text' : 'password'" 
            id="password" 
            name="rewritePassword" 
            placeholder="Nhập lại mật khẩu" 
            required
            [(ngModel)] = 'rewritePassword'>
        </div>
            <div class="checkbox">
                <input type="checkbox" id="remember" name="remember" [(ngModel)]="showPassword">
                <label>Hiển thị mật khẩu</label>
            </div>
        <button type="submit">Tạo tài khoản</button>
    </form>
</div>
